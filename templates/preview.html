<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Live Preview</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--background, #0f172a);
      color: var(--foreground, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar-btn {
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      color: var(--muted-foreground, #94a3b8);
      user-select: none;
    }
    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--foreground, #ffffff);
    }
    .toolbar-btn.active {
      background: #2563eb !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }
    .iframe-wrapper {
      flex: 1;
      position: relative;
      background: #ffffff;
      transition: all 0.3s ease;
    }
    .iframe-wrapper.mobile {
      max-width: 412px;
      margin: 20px auto;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 8px solid #334155;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #22c55e;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .inspector-overlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      display: none;
      z-index: 50;
      cursor: crosshair;
    }
    .inspector-box {
      position: absolute;
      border: 2px solid #3b82f6;
      background: rgba(59, 130, 246, 0.2);
      border-radius: 4px;
      pointer-events: none;
      transition: all 0.05s ease;
      display: none;
    }
    .inspector-badge {
      position: absolute;
      background: #1e293b;
      color: #60a5fa;
      font-size: 11px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Tab Bar -->
  <div class="flex items-center justify-between px-3 py-1.5 bg-[var(--card,#1e293b)] border-b border-[var(--border,#334155)] text-xs">
    <div class="flex items-center gap-2">
      <div class="px-3 py-1 bg-[var(--background,#0f172a)] rounded-t font-medium flex items-center gap-2 border-t border-x border-[var(--border,#334155)]">
        <span>Live Preview</span>
        <span class="text-gray-500 hover:text-white cursor-pointer">×</span>
      </div>
      <button class="text-gray-400 hover:text-white px-2 py-0.5 rounded hover:bg-white/5">+</button>
    </div>
    <div class="flex items-center gap-1">
      <button id="btn-external" title="Open in External Browser" class="toolbar-btn text-xs gap-1">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Browser</span>
      </button>
    </div>
  </div>

  <!-- Main Navigation & Tool Bar -->
  <div class="flex items-center gap-2 px-3 py-2 bg-[var(--card,#1e293b)] border-b border-[var(--border,#334155)]">
    <div class="flex items-center gap-1">
      <button id="btn-back" class="toolbar-btn" title="Back">←</button>
      <button id="btn-forward" class="toolbar-btn" title="Forward">→</button>
      <button id="btn-refresh" class="toolbar-btn" title="Refresh">↻</button>
    </div>

    <!-- URL Bar -->
    <div class="flex-1 flex items-center bg-[var(--background,#0f172a)] border border-[var(--border,#334155)] rounded-lg px-3 py-1.5 text-sm gap-2 focus-within:border-blue-500">
      <span class="text-gray-500">🌐</span>
      <input id="url-input" type="text" value="http://localhost:5173" class="w-full bg-transparent border-none outline-none text-[var(--foreground,#f8fafc)] font-mono text-xs" placeholder="Type a URL...">
    </div>

    <!-- Cursor-style Tools -->
    <div class="flex items-center gap-1 pl-1 border-l border-gray-700">
      <!-- Pencil / Annotate -->
      <button id="btn-pencil" class="toolbar-btn" title="Pencil (Draw / Annotate)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      </button>

      <!-- Element Inspector Pointer (↖) -->
      <button id="btn-inspector" class="toolbar-btn" title="Element Inspector (↖ Click element to select for AI)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          <path d="m13 13 6 6"/>
        </svg>
      </button>

      <!-- Mobile / Desktop View Toggle -->
      <button id="btn-mobile" class="toolbar-btn" title="Toggle Mobile / Desktop View">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
      </button>
    </div>
  </div>

  <!-- Preview Frame -->
  <div id="wrapper" class="iframe-wrapper">
    <iframe id="preview-frame" src="http://localhost:5173"></iframe>

    <!-- Overlay for Element Picking -->
    <div id="inspector-overlay" class="inspector-overlay">
      <div id="inspector-box" class="inspector-box"></div>
      <div id="inspector-badge" class="inspector-badge">&lt;element&gt;</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span class="text-green-400 text-base">🎯</span>
    <div>
      <b class="text-white block">Element copied for Antigravity!</b>
      <span class="text-xs text-gray-300">Switch to chat and press <b>Ctrl + V</b></span>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const iframe = document.getElementById('preview-frame');
    const wrapper = document.getElementById('wrapper');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnMobile = document.getElementById('btn-mobile');
    const btnInspector = document.getElementById('btn-inspector');
    const btnExternal = document.getElementById('btn-external');
    const toast = document.getElementById('toast');
    const overlay = document.getElementById('inspector-overlay');
    const box = document.getElementById('inspector-box');
    const badge = document.getElementById('inspector-badge');

    let isInspectorActive = false;

    function loadUrl() {
      let url = urlInput.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'http://' + url;
        urlInput.value = url;
      }
      iframe.src = url;
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadUrl();
    });

    btnRefresh.addEventListener('click', () => {
      iframe.src = iframe.src;
    });

    btnBack.addEventListener('click', () => {
      try { iframe.contentWindow.history.back(); } catch (_) {}
    });

    btnForward.addEventListener('click', () => {
      try { iframe.contentWindow.history.forward(); } catch (_) {}
    });

    btnMobile.addEventListener('click', () => {
      wrapper.classList.toggle('mobile');
      btnMobile.classList.toggle('active');
    });

    btnExternal.addEventListener('click', () => {
      window.open(urlInput.value, '_blank');
    });

    function showToast() {
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Toggle Inspector
    btnInspector.addEventListener('click', () => {
      isInspectorActive = !isInspectorActive;
      btnInspector.classList.toggle('active', isInspectorActive);
      overlay.style.display = isInspectorActive ? 'block' : 'none';
      if (!isInspectorActive) {
        box.style.display = 'none';
        badge.style.display = 'none';
      }
    });

    // Inspector Overlay Interaction
    overlay.addEventListener('mousemove', (e) => {
      if (!isInspectorActive) return;
      const rect = overlay.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const w = 180;
      const h = 40;
      box.style.display = 'block';
      box.style.left = `${Math.max(0, x - w / 2)}px`;
      box.style.top = `${Math.max(0, y - h / 2)}px`;
      box.style.width = `${w}px`;
      box.style.height = `${h}px`;

      badge.style.display = 'block';
      badge.style.left = `${Math.max(0, x - w / 2)}px`;
      badge.style.top = `${Math.max(0, y - h / 2 - 22)}px`;
      badge.textContent = `Target Element [${Math.round(x)}, ${Math.round(y)}]`;
    });

    overlay.addEventListener('click', (e) => {
      if (!isInspectorActive) return;
      const rect = overlay.getBoundingClientRect();
      const x = Math.round(e.clientX - rect.left);
      const y = Math.round(e.clientY - rect.top);

      const payload = `[Live Preview Element (Coordinates: X: ${x}, Y: ${y}) on ${urlInput.value}]`;
      navigator.clipboard.writeText(payload).then(() => {
        showToast();
      });

      isInspectorActive = false;
      btnInspector.classList.remove('active');
      overlay.style.display = 'none';
      box.style.display = 'none';
      badge.style.display = 'none';
    });
  </script>
</body>
</html>
